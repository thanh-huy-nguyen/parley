name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.1
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch and the package
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchaudio==2.11.0 torchvision==0.29.1
          pip install -e ".[demo,test]"
      - name: Run the tests that need no weights
        run: pytest -m "not weights and not gpu"
